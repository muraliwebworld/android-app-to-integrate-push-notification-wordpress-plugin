plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
}
check.dependsOn 'assembleDebugAndroidTest'

android {
    compileSdk 36

    defaultConfig {
        applicationId "com.sample.pnfpbandroid"
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName "2.0"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // API Configuration - UPDATE THIS FOR YOUR WORDPRESS SITE
        buildConfigField "String", "API_BASE_URL", '"https://www.muraliwebworld.com/"'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        resources {
            excludes += ['LICENSE.txt']
        }
    }


    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Disable Timber lint checks due to AGP 8.4.2 compatibility issue
    // See: https://github.com/JakeWharton/timber/issues/347
    lint {
        disable 'LogNotTimber', 'StringFormatInTimber', 'ThrowableNotAtBeginning',
                'BinaryOperationInTimber', 'TimberArgCount', 'TimberArgTypes',
                'TimberTagLength', 'TimberExceptionLogging'
    }
    
    namespace 'com.sample.pnfpbandroid'
}

dependencies {
    // AndroidX Core & Kotlin Extensions
    implementation 'androidx.annotation:annotation:1.8.0'
    implementation 'androidx.vectordrawable:vectordrawable-animated:1.1.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Activity & Fragment
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.fragment:fragment-ktx:1.7.0'

    // Material Design
    implementation 'com.google.android.material:material:1.12.0'

    // Firebase BoM with latest versions
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-installations-ktx'

    // Security & Encryption
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Networking - OkHttp & Retrofit
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'

    // Dependency Injection - Hilt
    implementation 'com.google.dagger:hilt-android:2.59.2'
    ksp 'com.google.dagger:hilt-compiler:2.59.2'

    // Logging
    implementation 'com.jakewharton.timber:timber:4.7.1'

    // Work Scheduling
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // UI
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // JSON Parsing
    implementation 'com.google.code.gson:gson:2.10.1'

    // Testing Dependencies
    androidTestImplementation 'androidx.test:core:1.6.1' // <-- ADD THIS LINE
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'junit:junit:4.13.2'
    testImplementation 'junit:junit:4.13.2'

}
